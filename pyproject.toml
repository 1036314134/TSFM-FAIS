[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsfm-fais"
version = "0.1.0"
description = "Block-wise forecast-aware imputer selection for multivariate time series"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "joblib>=1.3",
  "lightgbm>=4.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "psutil>=5.9",
  "pyarrow>=14",
  "pydantic>=2.6,<3",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
deep-imputers = [
  "pypots>=1.5,<1.6",
  "torch>=2.3,<3",
]
selector-baselines = ["torch>=2.3,<3"]
forecast-chronos = ["chronos-forecasting>=2.1,<3"]
forecast-timesfm = ["timesfm>=2.0"]
forecast-tirex = ["tirex-ts>=1.4,<2"]
forecast-sundial = ["transformers>=4.40", "torch>=2.3,<3"]

[project.scripts]
fais = "tsfm_fais.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "slow: requires substantial local compute",
  "gpu: requires a GPU",
  "network: downloads data or model weights",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
packages = ["tsfm_fais"]
warn_unused_ignores = true
disable_error_code = ["import-untyped"]
