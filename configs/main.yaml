schema_version: 1
seed: 20260710
registries:
  data_manifest: data/datasets.yaml
  imputer_registry: imputers/pool.yaml
  forecaster_registry: forecasters/pool.yaml
  router_config: router/block_fais.yaml
experiment:
  split: leave_dataset_out
  context_length: 48
  horizon: 8
  target_indices: [0, 1]
  missing_mechanisms:
    - random_point
    - independent_block
    - synchronous_block
    - staggered_correlated
    - value_dependent
    - tail_mixed
  missing_rates: [0.1, 0.2, 0.3, 0.5]
  seeds: [20260710]
  candidate_ids: all
  deep_imputer_epochs: 10
  deep_imputer_batch_size: 16
  csdi_num_samples: 5
  missforest_n_jobs: 8
  max_items_per_dataset: 4
  max_training_windows_per_dataset: 32
  max_train_origins_per_item: 1
  max_eval_origins_per_item: 1
  max_train_episodes_per_dataset: 12
  max_teacher_blocks_per_episode: 4
  max_teacher_candidates_per_episode: 6
  max_pair_labels_per_episode: 4
  forecast_num_samples: 5
  save_all_candidate_outputs: false
runtime:
  output_root: ../artifacts
  device: auto
  fail_fast: false
