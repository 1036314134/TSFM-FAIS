ranker_target: imputation_loss
selection_granularity: sequence
routing_structure: independent
candidate_switch_penalty: 0.0
forecast_consensus:
  mode: disabled
  candidates: []
fallback:
  internal: [linear_interp, locf, train_median]
  tail: [locf, train_median]
