<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1360" viewBox="0 0 1800 1360">
  <defs>
    <style>
      .txt { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172B3A; }
      .title { font-size: 36px; font-weight: 700; }
      .body { font-size: 32px; }
      .small { font-size: 27px; }
      .phase { font-size: 35px; font-weight: 700; }
      .line { fill: none; stroke: #56636E; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .card { stroke-width: 4; rx: 18; ry: 18; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#56636E"/>
    </marker>
    <marker id="parrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7656A3"/>
    </marker>
  </defs>
  <rect width="1800" height="1360" fill="#FFFFFF"/>

  <!-- Offline teacher -->
  <rect x="25" y="20" width="1750" height="230" rx="18" fill="#F3EFFA" stroke="#7656A3" stroke-width="4"/>
  <text class="txt phase" x="55" y="65" fill="#7656A3">离线预测教师</text>
  <text class="txt small" x="55" y="100" fill="#56636E">历史训练起点；只有该阶段可观测未来</text>

  <g class="txt body" text-anchor="middle">
    <rect x="300" y="125" width="220" height="82" rx="12" fill="#FFFFFF" stroke="#7656A3" stroke-width="3"/>
    <text x="410" y="158"><tspan x="410">受损上下文 Cₑ</tspan><tspan x="410" dy="37">干净未来 Yₑ</tspan></text>
    <rect x="590" y="125" width="240" height="82" rx="12" fill="#FFFFFF" stroke="#7656A3" stroke-width="3"/>
    <text x="710" y="158"><tspan x="710">候选补全</tspan><tspan x="710" dy="37">Iₐ(Cₑ)</tspan></text>
    <rect x="900" y="125" width="180" height="82" rx="12" fill="#FFFFFF" stroke="#7656A3" stroke-width="3"/>
    <text x="990" y="158"><tspan x="990">冻结 TSFM</tspan><tspan x="990" dy="37">f(·)</tspan></text>
    <rect x="1150" y="125" width="225" height="82" rx="12" fill="#FFFFFF" stroke="#7656A3" stroke-width="3"/>
    <text x="1262" y="158"><tspan x="1262">未来 MASE</tspan><tspan x="1262" dy="37">+ 成对效应</tspan></text>
    <rect x="1445" y="125" width="265" height="82" rx="12" fill="#FFFFFF" stroke="#7656A3" stroke-width="3"/>
    <text x="1577" y="158"><tspan x="1577">固定风险排序器</tspan><tspan x="1577" dy="37">+ 成对模型</tspan></text>
  </g>
  <g fill="none" stroke="#7656A3" stroke-width="4" marker-end="url(#parrow)">
    <path d="M520 166 H584"/><path d="M830 166 H894"/><path d="M1080 166 H1144"/><path d="M1375 166 H1439"/>
  </g>

  <!-- Deployment -->
  <rect x="25" y="280" width="1750" height="795" rx="18" fill="#F7F8F9" stroke="#2B6C9E" stroke-width="4"/>
  <text class="txt phase" x="55" y="330" fill="#2B6C9E">部署流程</text>
  <text class="txt small" x="1745" y="330" fill="#7656A3" text-anchor="end">固定已训练评分器；路由器不可访问预测未来 Yₜ</text>
  <path d="M1577 207 C1577 250 1580 260 1515 280" fill="none" stroke="#7656A3" stroke-width="4" marker-end="url(#parrow)"/>

  <!-- Card 1 -->
  <rect class="card" x="50" y="365" width="520" height="280" fill="#EDF4F8" stroke="#2B6C9E"/>
  <circle cx="95" cy="410" r="29" fill="#2B6C9E"/>
  <text class="txt title" x="95" y="422" fill="#FFFFFF" text-anchor="middle">1</text>
  <text class="txt title" x="140" y="422">提取缺失块</text>
  <g transform="translate(95 475)">
    <rect x="0" y="0" width="145" height="100" fill="#FFFFFF" stroke="#9AA4AC" stroke-width="3"/>
    <path d="M12 30 L35 17 L58 33 L78 20 M108 26 L132 18" class="thin" stroke="#2B6C9E"/>
    <path d="M12 70 L35 53 L58 68 M88 58 L110 72 L132 58" class="thin" stroke="#2B6C9E"/>
    <rect x="75" y="10" width="34" height="34" fill="#FFF4DC" stroke="#C47700" stroke-width="3" stroke-dasharray="9 6"/>
    <rect x="55" y="48" width="34" height="34" fill="#FFF4DC" stroke="#C47700" stroke-width="3" stroke-dasharray="9 6"/>
  </g>
  <text class="txt body" x="285" y="485"><tspan x="285">极大连续区间 B</tspan><tspan x="285" dy="46">缺失块几何</tspan><tspan x="285" dy="46">掩码/上下文特征</tspan></text>

  <!-- Card 2 -->
  <rect class="card" x="640" y="365" width="520" height="280" fill="#FFF4DC" stroke="#C47700"/>
  <circle cx="685" cy="410" r="29" fill="#C47700"/>
  <text class="txt title" x="685" y="422" fill="#FFFFFF" text-anchor="middle">2</text>
  <text class="txt title" x="730" y="422">生成候选短名单</text>
  <g transform="translate(685 480)" fill="#FFFFFF" stroke="#C47700" stroke-width="3">
    <rect x="0" y="0" width="120" height="23" rx="5"/><rect x="0" y="38" width="155" height="23" rx="5"/><rect x="0" y="76" width="95" height="23" rx="5"/>
  </g>
  <text class="txt body" x="875" y="485"><tspan x="875">先验排序 R₀</tspan><tspan x="875" dy="46">保留 K ≤ 6</tspan><tspan x="875" dy="46">强制含 LOCF/线性插值</tspan></text>

  <!-- Card 3 -->
  <rect class="card" x="1230" y="365" width="520" height="280" fill="#FFF4DC" stroke="#C47700"/>
  <circle cx="1275" cy="410" r="29" fill="#C47700"/>
  <text class="txt title" x="1275" y="422" fill="#FFFFFF" text-anchor="middle">3</text>
  <text class="txt title" x="1320" y="422">采集候选证据</text>
  <g transform="translate(1270 485)" fill="#FFFFFF" stroke="#C47700" stroke-width="3">
    <rect x="0" y="18" width="120" height="75" rx="8"/><rect x="13" y="9" width="120" height="75" rx="8"/><rect x="26" y="0" width="120" height="75" rx="8"/>
    <text class="txt body" x="86" y="49" fill="#C47700" text-anchor="middle">Iₐ</text>
  </g>
  <text class="txt body" x="1460" y="485"><tspan x="1460">真实受损上下文</tspan><tspan x="1460" dy="46">8 个伪缺失块</tspan><tspan x="1460" dy="46">覆盖率/误差/偏差</tspan></text>

  <!-- Card 4 -->
  <rect class="card" x="1230" y="735" width="520" height="280" fill="#FFF4DC" stroke="#C47700"/>
  <circle cx="1275" cy="780" r="29" fill="#C47700"/>
  <text class="txt title" x="1275" y="792" fill="#FFFFFF" text-anchor="middle">4</text>
  <text class="txt title" x="1320" y="792">精炼一元风险</text>
  <g transform="translate(1270 860)">
    <g fill="#E8C27A" stroke="#FFFFFF" stroke-width="4">
      <rect x="0" y="0" width="35" height="35"/><rect x="38" y="0" width="35" height="35"/><rect x="76" y="0" width="35" height="35"/><rect x="114" y="0" width="35" height="35"/>
      <rect x="0" y="38" width="35" height="35"/><rect x="38" y="38" width="35" height="35"/><rect x="76" y="38" width="35" height="35"/><rect x="114" y="38" width="35" height="35"/>
      <rect x="0" y="76" width="35" height="35"/><rect x="38" y="76" width="35" height="35"/><rect x="76" y="76" width="35" height="35"/><rect x="114" y="76" width="35" height="35"/>
    </g>
  </g>
  <text class="txt body" x="1460" y="865"><tspan x="1460">精炼评分 R(b,a)</tspan><tspan x="1460" dy="46">逐块-候选风险</tspan></text>

  <!-- Card 5 -->
  <rect class="card" x="640" y="735" width="520" height="280" fill="#E9F6F2" stroke="#187C68"/>
  <circle cx="685" cy="780" r="29" fill="#187C68"/>
  <text class="txt title" x="685" y="792" fill="#FFFFFF" text-anchor="middle">5</text>
  <text class="txt title" x="730" y="792">联合分配</text>
  <g transform="translate(690 855)" fill="#FFFFFF" stroke="#187C68" stroke-width="4">
    <path d="M20 85 L90 18 L155 85 M20 85 H155" fill="none" stroke-dasharray="10 7"/>
    <circle cx="20" cy="85" r="22"/><circle cx="90" cy="18" r="22"/><circle cx="155" cy="85" r="22"/>
  </g>
  <text class="txt body" x="875" y="855"><tspan x="875">一元 + 成对风险</tspan><tspan x="875" dy="46">原生有效性约束</tspan><tspan x="875" dy="46">束宽 32 + 修复状态</tspan></text>

  <!-- Card 6 -->
  <rect class="card" x="50" y="735" width="520" height="280" fill="#E9F6F2" stroke="#187C68"/>
  <circle cx="95" cy="780" r="29" fill="#187C68"/>
  <text class="txt title" x="95" y="792" fill="#FFFFFF" text-anchor="middle">6</text>
  <text class="txt title" x="140" y="792">组装并预测</text>
  <g transform="translate(90 865)">
    <rect x="0" y="0" width="85" height="90" fill="#FFFFFF" stroke="#187C68" stroke-width="3"/>
    <rect x="27" y="23" width="25" height="18" fill="#A9D8CB"/><rect x="47" y="52" width="25" height="18" fill="#A9D8CB"/>
    <path d="M95 45 H140" class="line" marker-end="url(#arrow)"/>
    <rect x="145" y="10" width="125" height="70" rx="10" fill="#FFFFFF" stroke="#187C68" stroke-width="3"/>
    <text class="txt body" x="207" y="56" text-anchor="middle">TSFM</text>
    <path d="M280 45 H325" class="line" marker-end="url(#arrow)"/>
    <path d="M330 65 L365 37 L400 53 L438 13" fill="none" stroke="#187C68" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="txt body" x="310" y="990" text-anchor="middle">Z(a) → f(·) → Ŷ</text>

  <!-- Snake flow -->
  <g fill="none" stroke="#56636E" stroke-width="4" marker-end="url(#arrow)">
    <path d="M570 505 H632"/><path d="M1160 505 H1222"/><path d="M1490 645 V727"/><path d="M1230 875 H1168"/><path d="M640 875 H578"/>
  </g>

  <!-- Controlled ladder -->
  <rect x="25" y="1105" width="1750" height="230" rx="18" fill="#FFFFFF" stroke="#9AA4AC" stroke-width="4"/>
  <text class="txt phase" x="55" y="1150" fill="#56636E">预注册单因素对照</text>
  <g class="txt body" text-anchor="middle">
    <rect x="55" y="1182" width="315" height="120" rx="14" fill="#FFFFFF" stroke="#56636E" stroke-width="3"/>
    <text x="212" y="1227"><tspan x="212" font-weight="700">序列重建</tspan><tspan x="212" dy="40">重建目标 / 序列决策</tspan></text>
    <rect x="470" y="1182" width="315" height="120" rx="14" fill="#FFFFFF" stroke="#56636E" stroke-width="3"/>
    <text x="627" y="1227"><tspan x="627" font-weight="700">序列预测</tspan><tspan x="627" dy="40">预测目标 / 序列决策</tspan></text>
    <rect x="885" y="1182" width="315" height="120" rx="14" fill="#FFFFFF" stroke="#56636E" stroke-width="3"/>
    <text x="1042" y="1227"><tspan x="1042" font-weight="700">独立块预测</tspan><tspan x="1042" dy="40">预测目标 / 逐块决策</tspan></text>
    <rect x="1300" y="1168" width="420" height="145" rx="14" fill="#E9F6F2" stroke="#187C68" stroke-width="4"/>
    <text x="1510" y="1210"><tspan x="1510" font-weight="700">B-FAIS 核心</tspan><tspan x="1510" dy="40" font-weight="700">结构化块预测</tspan><tspan x="1510" dy="40">关系图 + 束搜索</tspan></text>
  </g>
  <g fill="none" stroke="#56636E" stroke-width="4" marker-end="url(#arrow)">
    <path d="M370 1242 H462"/><path d="M785 1242 H877"/><path d="M1200 1242 H1292"/>
  </g>
  <g class="txt small" fill="#56636E" text-anchor="middle">
    <text x="416" y="1218">训练目标</text><text x="831" y="1218">决策粒度</text><text x="1246" y="1218">分配结构</text>
  </g>
</svg>
